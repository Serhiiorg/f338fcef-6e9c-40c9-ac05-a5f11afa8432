<body class="theme-light">

  <script type="text/babel">
    // Context for theme and cart management
    const ThemeContext = React.createContext();
    const CartContext = React.createContext();
    
    // Theme Provider Component
    const ThemeProvider = ({ children }) => {
      const [darkMode, setDarkMode] = React.useState(false);
      
      React.useEffect(() => {
        document.body.className = darkMode ? 'theme-dark' : 'theme-light';
      }, [darkMode]);
      
      return (
        <ThemeContext.Provider value={{ darkMode, setDarkMode }}>
          {children}
        </ThemeContext.Provider>
      );
    };
    
    // Cart Provider Component
    const CartProvider = ({ children }) => {
      const [cart, setCart] = React.useState([]);
      
      const addToCart = (product) => {
        const existingItem = cart.find(item => item.id === product.id);
        
        if (existingItem) {
          setCart(cart.map(item => 
            item.id === product.id 
              ? { ...item, quantity: item.quantity + 1 } 
              : item
          ));
        } else {
          setCart([...cart, { ...product, quantity: 1 }]);
        }
      };
      
      const removeFromCart = (productId) => {
        setCart(cart.filter(item => item.id !== productId));
      };
      
      const updateQuantity = (productId, quantity) => {
        if (quantity <= 0) {
          removeFromCart(productId);
          return;
        }
        
        setCart(cart.map(item => 
          item.id === productId 
            ? { ...item, quantity } 
            : item
        ));
      };
      
      const getCartTotal = () => {
        return cart.reduce((total, item) => total + (item.price * item.quantity), 0);
      };
      
      const getCartCount = () => {
        return cart.reduce((count, item) => count + item.quantity, 0);
      };
      
      return (
        <CartContext.Provider value={{ 
          cart, 
          addToCart, 
          removeFromCart, 
          updateQuantity, 
          getCartTotal,
          getCartCount
        }}>
          {children}
        </CartContext.Provider>
      );
    };

    // Sales Chart Component
    const SalesChart = () => {

    // Contact Form Component
    const ContactForm = () => {
      const [formState, setFormState] = React.useState({
        name: '',
        email: '',
        message: ''
      });
      
      const [formStatus, setFormStatus] = React.useState({
        submitted: false,
        error: false,
        message: ''
      });
      
      const handleChange = (e) => {
        setFormState({
          ...formState,
          [e.target.name]: e.target.value
        });
      };
      
      const handleSubmit = (e) => {
        e.preventDefault();
        
        // Validate form
        if (!formState.name || !formState.email || !formState.message) {
          setFormStatus({
            submitted: true,
            error: true,
            message: 'Please fill out all fields.'
          });
          return;
        }
        
        // Simulate form submission
        setTimeout(() => {
          setFormStatus({
            submitted: true,
            error: false,
            message: 'Thank you for your message! We will get back to you soon.'
          });
          
          setFormState({
            name: '',
            email: '',
            message: ''
          });
        }, 1000);
      };
      
      return (
        <section id="contact" className="py-16">
          <div className="container mx-auto px-4">
            <div className="max-w-3xl mx-auto">
              <div className="text-center mb-12">
                <h2 className="text-3xl font-bold mb-4">Get In Touch</h2>
                <p className="opacity-75">
                  Have questions about our products or want to place a bulk order? Reach out to us!
                </p>
              </div>
              
              <div className="card rounded-lg shadow-md p-6 md:p-8">
                {formStatus.submitted && !formStatus.error ? (
                  <div className="bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-100 p-4 rounded-md mb-6 slide-in">
                    <div className="flex items-center">
                      <i data-lucide="check-circle" className="w-5 h-5 mr-2"></i>
                      <p>{formStatus.message}</p>
                    </div>
                  </div>
                ) : null}
                
                {formStatus.submitted && formStatus.error ? (
                  <div className="bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-100 p-4 rounded-md mb-6 slide-in">
                    <div className="flex items-center">
                      <i data-lucide="alert-circle" className="w-5 h-5 mr-2"></i>
                      <p>{formStatus.message}</p>
                    </div>
                  </div>
                ) : null}
                
                <form onSubmit={handleSubmit}>
                  <div className="mb-4">
                    <label htmlFor="name" className="block mb-2 font-medium">Name</label>
                    <input
                      type="text"
                      id="name"
                      name="name"
                      value={formState.name}
                      onChange={handleChange}
                      className="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-red-500 bg-transparent"
                      placeholder="Your name"
                    />
                  </div>
                  
                  <div className="mb-4">
                    <label htmlFor="email" className="block mb-2 font-medium">Email</label>
                    <input
                      type="email"
                      id="email"
                      name="email"
                      value={formState.email}
                      onChange={handleChange}
                      className="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-red-500 bg-transparent"
                      placeholder="your.email@example.com"
                    />
                  </div>
                  
                  <div className="mb-6">
                    <label htmlFor="message" className="block mb-2 font-medium">Message</label>
                    <textarea
                      id="message"
                      name="message"
                      value={formState.message}
                      onChange={handleChange}
                      rows="4"
                      className="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-red-500 bg-transparent"
                      placeholder="Your message..."
                    ></textarea>
                  </div>
                  
                  <button
                    type="submit"
                    className="w-full btn-primary py-3 rounded-md text-white font-medium hover:opacity-90 transition-opacity"
                  >
                    Send Message
                  </button>
                </form>
              </div>
            </div>
          </div>
        </section>
      );
    };
    
    // Footer Component
    const Footer = () => {
      React.useEffect(() => {
        lucide.createIcons();
      }, []);
      
      return (
        <footer className="bg-gray-100 dark:bg-gray-800 pt-12 pb-6">
          <div className="container mx-auto px-4">
            <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
              <div>
                <div className="flex items-center mb-4">
                  <i data-lucide="cherry" className="w-6 h-6 text-red-500 mr-2"></i>
                  <h3 className="text-xl font-bold">Tomato Haven</h3>
                </div>
                <p className="opacity-75 mb-4">
                  Premium tomatoes grown with care and delivered fresh to your door.
                </p>
                <div className="flex space-x-4">
                  <a href="#" className="hover:text-red-500 transition-colors">
                    <i data-lucide="facebook" className="w-5 h-5"></i>
                  </a>
                  <a href="#" className="hover:text-red-500 transition-colors">
                    <i data-lucide="instagram" className="w-5 h-5"></i>
                  </a>
                  <a href="#" className="hover:text-red-500 transition-colors">
                    <i data-lucide="twitter" className="w-5 h-5"></i>
                  </a>
                  <a href="#" className="hover:text-red-500 transition-colors">
                    <i data-lucide="youtube" className="w-5 h-5"></i>
                  </a>
                </div>
              </div>
              
              <div>
                <h4 className="font-semibold mb-4">Quick Links</h4>
                <ul className="space-y-2">
                  <li><a href="#home" className="opacity-75 hover:opacity-100 transition-opacity">Home</a></li>
                  <li><a href="#products" className="opacity-75 hover:opacity-100 transition-opacity">Products</a></li>
                  <li><a href="#about" className="opacity-75 hover:opacity-100 transition-opacity">About Us</a></li>
                  <li><a href="#contact" className="opacity-75 hover:opacity-100 transition-opacity">Contact</a></li>
                </ul>
              </div>
              
              <div>
                <h4 className="font-semibold mb-4">Products</h4>
                <ul className="space-y-2">
                  <li><a href="#" className="opacity-75 hover:opacity-100 transition-opacity">Roma Tomatoes</a></li>
                  <li><a href="#" className="opacity-75 hover:opacity-100 transition-opacity">Cherry Tomatoes</a></li>
                  <li><a href="#" className="opacity-75 hover:opacity-100 transition-opacity">Heirloom Tomatoes</a></li>
                  <li><a href="#" className="opacity-75 hover:opacity-100 transition-opacity">Beefsteak Tomatoes</a></li>
                </ul>
              </div>
              
              <div>
                <h4 className="font-semibold mb-4">Contact Info</h4>
                <ul className="space-y-2">
                  <li className="flex items-center opacity-75">
                    <i data-lucide="map-pin" className="w-4 h-4 mr-2"></i>
                    123 Tomato Farm Rd, Freshville
                  </li>
                  <li className="flex items-center opacity-75">
                    <i data-lucide="phone" className="w-4 h-4 mr-2"></i>
                    (555) 123-4567
                  </li>
                  <li className="flex items-center opacity-75">
                    <i data-lucide="mail" className="w-4 h-4 mr-2"></i>
                    info@tomatohaven.com
                  </li>
                  <li className="flex items-center opacity-75">
                    <i data-lucide="clock" className="w-4 h-4 mr-2"></i>
                    Mon-Fri: 9am-5pm
                  </li>
                </ul>
              </div>
            </div>
            
            <div className="border-t pt-6 text-center opacity-75 text-sm">
              <p>&copy; {new Date().getFullYear()} Tomato Haven. All rights reserved.</p>
            </div>
          </div>
        </footer>
      );
    };
    
    // Cart Drawer Component
    const CartDrawer = () => {
      const { cart, removeFromCart, updateQuantity, getCartTotal } = React.useContext(CartContext);
      const [isOpen, setIsOpen] = React.useState(false);
      
      return (
        <>
          <button 
            onClick={() => setIsOpen(true)}
            className="fixed bottom-6 right-6 z-40 bg-red-500 text-white p-4 rounded-full shadow-lg hover:bg-red-600 transition-colors"
            aria-label="Open cart"
          >
            <i data-lucide="shopping-cart" className="w-6 h-6"></i>
          </button>
          
          {isOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div 
                className="absolute inset-0 bg-black bg-opacity-50 transition-opacity"
                onClick={() => setIsOpen(false)}
              ></div>
              
              <div className="absolute inset-y-0 right-0 max-w-full flex">
                <div className="relative w-screen max-w-md">
                  <div className="h-full flex flex-col bg-white dark:bg-gray-800 shadow-xl overflow-y-auto">
                    <div className="flex-1 py-6 overflow-y-auto px-4 sm:px-6">
                      <div className="flex items-start justify-between">
                        <h2 className="text-lg font-medium">Shopping Cart</h2>
                        <button 
                          onClick={() => setIsOpen(false)}
                          className="p-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                        >
                          <i data-lucide="x" className="w-5 h-5"></i>
                        </button>
                      </div>
                      
                      <div className="mt-8">
                        {cart.length === 0 ? (
                          <div className="text-center py-12">
                            <i data-lucide="shopping-cart" className="w-16 h-16 mx-auto opacity-30 mb-4"></i>
                            <p>Your cart is empty</p>
                            <button 
                              onClick={() => setIsOpen(false)}
                              className="mt-4 text-red-500 hover:text-red-600 transition-colors"
                            >
                              Continue Shopping
                            </button>
                          </div>
                        ) : (
                          <div className="flow-root">
                            <ul className="-my-6 divide-y">
                              {cart.map(item => (
                                <li key={item.id} className="py-6 flex">
                                  <div className="flex-shrink-0 w-24 h-24 rounded-md overflow-hidden">
                                    <img 
                                      src={item.image} 
                                      alt={item.name} 
                                      className="w-full h-full object-cover"
                                    />
                                  </div>
                                  
                                  <div className="ml-4 flex-1 flex flex-col">
                                    <div>
                                      <div className="flex justify-between text-base font-medium">
                                        <h3>{item.name}</h3>
                                        <p className="ml-4">${(item.price * item.quantity).toFixed(2)}</p>
                                      </div>
                                      <p className="mt-1 text-sm opacity-75">${item.price.toFixed(2)} each</p>
                                    </div>
                                    
                                    <div className="flex-1 flex items-end justify-between text-sm">
                                      <div className="flex items-center border rounded-md">
                                        <button 
                                          onClick={() => updateQuantity(item.id, item.quantity - 1)}
                                          className="px-3 py-1 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                                        >
                                          -
                                        </button>
                                        <span className="px-3 py-1">{item.quantity}</span>
                                        <button 
                                          onClick={() => updateQuantity(item.id, item.quantity + 1)}
                                          className="px-3 py-1 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                                        >
                                          +
                                        </button>
                                      </div>
                                      
                                      <button 
                                        onClick={() => removeFromCart(item.id)}
                                        className="text-red-500 hover:text-red-600 transition-colors"
                                      >
                                        Remove
                                      </button>
                                    </div>
                                  </div>
                                </li>
                              ))}
                            </ul>
                          </div>
                        )}
                      </div>
                    </div>
                    
                    {cart.length > 0 && (
                      <div className="border-t border-gray-200 dark:border-gray-700 py-6 px-4 sm:px-6">
                        <div className="flex justify-between text-base font-medium mb-4">
                          <p>Subtotal</p>
                          <p>${getCartTotal().toFixed(2)}</p>
                        </div>
                        <p className="text-sm opacity-75 mb-4">
                          Shipping and taxes calculated at checkout.
                        </p>
                        <button 
                          className="w-full btn-primary py-3 rounded-md text-white font-medium hover:opacity-90 transition-opacity"
                        >
                          Checkout
                        </button>
                        <div className="mt-4 text-center">
                          <button 
                            onClick={() => setIsOpen(false)}
                            className="text-sm hover:text-red-500 transition-colors"
                          >
                            Continue Shopping
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}
        </>
      );
    };
    
    // Main App Component
    const App = () => {
      React.useEffect(() => {
        lucide.createIcons();
      }, []);
      
      return (
        <ThemeProvider>
          <CartProvider>
            <div className="min-h-screen flex flex-col">
              <Header />
              <main className="flex-grow">
                <Hero />
                <ProductsSection />
                <AboutSection />
                <Testimonials />
                <ContactForm />
              </main>
              <Footer />
              <CartDrawer />
            </div>
          </CartProvider>
        </ThemeProvider>
      );
    };
    
    // Render the App
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
